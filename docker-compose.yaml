# ============================================================================
# TraderNex - Docker Compose Configuration
# ============================================================================
# 
# Este arquivo funciona tanto para desenvolvimento quanto para produção.
# 
# Para DESENVOLVIMENTO LOCAL:
#   - Crie um arquivo docker-compose.override.yaml com volumes para hot reload
#   - Defina DOCKERFILE=Dockerfile.dev e FRONTEND_DOCKERFILE=Dockerfile.dev
#
# Para PRODUÇÃO (Coolify):
#   - Use os Dockerfiles padrão (Dockerfile) - já configurado
#   - Não use volumes - já configurado
#   - Configure todas as variáveis de ambiente obrigatórias
#
# IMPORTANTE: 
# - Crie um arquivo .env na raiz com suas credenciais (veja ENV-TEMPLATE.md)
# - NUNCA commite o arquivo .env no Git!
#
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # Serviço: Banco de Dados PostgreSQL
  # --------------------------------------------------------------------------
  # db:
  #   image: postgres:15-alpine
  #   container_name: tradernex-db
  #   environment:
  #     POSTGRES_USER: ${DB_USER:-postgres}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
  #     POSTGRES_DB: ${DB_NAME:-tradernex}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "${DB_PORT:-5432}:5432"
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 10s
  #   networks:
  #     - tradernex-network
  #   restart: unless-stopped

  # --------------------------------------------------------------------------
  # Serviço: Backend API (Node.js + Express)
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      # Em produção: usa Dockerfile (padrão)
      # Em desenvolvimento: defina DOCKERFILE=Dockerfile.dev
      dockerfile: ${DOCKERFILE:-Dockerfile}
    container_name: tradernex-backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: ${DB_HOST:-localhost}
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-tradernex}
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: ${JWT_EXPIRE}
      FRONTEND_URL: ${FRONTEND_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING}
    ports:
      - "5000:5000"
      db:
        condition: service_healthy
    networks:
      - tradernex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # --------------------------------------------------------------------------
  # Serviço: Frontend (React + Vite + Nginx)
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      # Em produção: usa Dockerfile (padrão, multi-stage com nginx)
      # Em desenvolvimento: defina FRONTEND_DOCKERFILE=Dockerfile.dev
      dockerfile: ${FRONTEND_DOCKERFILE:-Dockerfile}
    container_name: tradernex-frontend
    environment:
      - NODE_ENV=${NODE_ENV}
    # Expor porta 80 para o Coolify detectar e rotear
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - tradernex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:

networks:
  tradernex-network:
    driver: bridge
